name: Rides Scheduled Dispatch Cron

on:
  schedule:
    # Dispatch upcoming scheduled rides and sweep stale requests.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: rides-production-dispatch
  cancel-in-progress: false

jobs:
  run-rides-cron:
    name: Trigger Scheduled Rides Dispatch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Rides Cron Endpoint
        env:
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ "$PRODUCTION_APP_URL" != https://* || -z "$CRON_SECRET" ]]; then
            echo "::error::Configure the HTTPS PRODUCTION_APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          ENDPOINT="${PRODUCTION_APP_URL%/}/api/cron/rides"
          HTTP_STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --connect-timeout 10 --max-time 90 --request POST "$ENDPOINT" \
            --header "Authorization: Bearer $CRON_SECRET")
          echo "HTTP Status Code: $HTTP_STATUS"
          case "$HTTP_STATUS" in
            200|204) ;;
            *) echo "::error::Rides cron returned HTTP $HTTP_STATUS."; exit 1 ;;
          esac
